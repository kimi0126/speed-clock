<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>究極再現・世界の超名機クロックコレクション</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="名機クロック">

  <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIuaMoeS7o+OCk+ODq+OCr+ODg+OCryIsCiAgInNob3J0X25hbWUiOiAi44Kv44Ot44OD44KvIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwNTA2MDgiLAogICJ0aGVtZV9jb2xvciIjogIiMwNTA2MDgiCn0=">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 98vh;
      background-color: #050608;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #161820 0%, #08090d 100%);
      padding: 18px 14px;
      border-radius: 28px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.95), inset 0 1px 1px rgba(255,255,255,0.12);
      width: 100%;
      max-width: 480px;
    }
    .clock-svg {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.85));
      display: block;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 13px; font-weight: bold; color: #94a3b8; }
    select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      max-width: 100%;
    }
    input[type="range"] { width: 130px; cursor: pointer; }
    input[type="number"] {
      width: 65px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      text-align: right;
    }
    .time-input { width: 44px !important; text-align: center !important; }
    .digital-readout {
      margin: 6px 0;
      font-size: 26px;
      font-family: "SF Mono", "Courier New", monospace;
      color: #cbd5e1;
      letter-spacing: 2px;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div class="container">
  <svg class="clock-svg" viewBox="0 0 360 360" id="clockSVG">
    <defs>
      <!-- デイトナ・サブダイヤル -->
      <g id="daytonaSubDial">
        <circle cx="0" cy="0" r="32" fill="#0b0c10" stroke="#cbd5e1" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="-30" x2="0" y2="-24" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="0" y1="30" x2="0" y2="24" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="-30" y1="0" x2="-24" y2="0" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="30" y1="0" x2="24" y2="0" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="0" y1="2" x2="0" y2="-20" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- ROLEX 王冠マーク -->
      <g id="rolexCoronet">
        <path d="M-10,0 L-13,-18 L-5,-9 L0,-22 L5,-9 L13,-18 L10,0 Z" fill="#eab308" stroke="#ca8a04" stroke-width="0.8"/>
        <circle cx="-13" cy="-19" r="1.8" fill="#eab308"/>
        <circle cx="-5" cy="-10" r="1.5" fill="#eab308"/>
        <circle cx="0" cy="-23" r="2" fill="#eab308"/>
        <circle cx="5" cy="-10" r="1.5" fill="#eab308"/>
        <circle cx="13" cy="-19" r="1.8" fill="#eab308"/>
        <ellipse cx="0" cy="1" rx="9" ry="2.5" fill="#eab308" stroke="#ca8a04" stroke-width="0.8"/>
      </g>

      <!-- AP タペストリー格子パターン -->
      <pattern id="apPattern" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="13" height="13" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
        <rect x="2" y="2" width="9" height="9" fill="#334155"/>
      </pattern>

      <!-- パテック 横ボーダーパターン -->
      <pattern id="nautilusPattern" width="360" height="10" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="360" y2="0" stroke="#0f172a" stroke-width="3"/>
        <line x1="0" y1="5" x2="360" y2="5" stroke="#1e3a5f" stroke-width="7"/>
      </pattern>
    </defs>

    <!-- レイヤー1: 文字盤 -->
    <g id="dialGroup"></g>

    <!-- レイヤー2: 針（時・分・秒・センターピン） -->
    <g id="hourGroup"></g>
    <g id="minGroup"></g>
    <g id="secGroup"></g>
    <g id="capGroup"></g>
  </svg>
  
  <div class="digital-readout" id="digitalTime">00:00:00</div>

  <div class="controls">
    <div class="control-row">
      <label for="themeSelector">名機デザイン:</label>
      <select id="themeSelector" onchange="changeTheme(this.value)">
        <option value="franck" selected>1. フランク ミュラー（トノウ カーベックス・カサブランカ）</option>
        <option value="rolex">2. ロレックス（コスモグラフ デイトナ）</option>
        <option value="ap">3. オーデマ ピゲ（ロイヤル オーク・タペストリー）</option>
        <option value="patek">4. パテック フィリップ（ノーチラス ブルー）</option>
        <option value="panerai">5. パネライ（ルミノール・サンドイッチ文字盤）</option>
        <option value="omega">6. オメガ（スピードマスター ムーンウォッチ）</option>
        <option value="cartier">7. カルティエ（サントス・ローマン＆青焼き針）</option>
        <option value="iwc">8. IWC（ポルトギーゼ・クロノグラフ リーフ針）</option>
        <option value="breitling">9. ブライトリング（ナビタイマー 航空計算尺）</option>
        <option value="gs">10. グランドセイコー（白樺 / 雪白 ドーフィン針）</option>
      </select>
    </div>

    <div class="control-row">
      <label>時刻指定:</label>
      <input type="number" id="targetHour" class="time-input" min="0" max="23" value="10">
      <span>:</span>
      <input type="number" id="targetMin" class="time-input" min="0" max="59" value="10">
      <span>:</span>
      <input type="number" id="targetSec" class="time-input" min="0" max="59" value="30">
      <button onclick="applyTargetTime()">設定</button>
      <button id="pauseBtn" onclick="togglePause()">一時停止</button>
    </div>

    <div class="control-row">
      <label for="speedRange">倍速:</label>
      <input type="range" id="speedRange" min="0" max="60" step="0.5" value="1">
      <input type="number" id="speedInput" min="0" max="3600" step="0.5" value="1">
      <span>倍</span>
    </div>

    <div class="button-group">
      <button onclick="setSpeed(1)">等倍</button>
      <button onclick="setSpeed(2)">2倍</button>
      <button onclick="setSpeed(10)">10倍</button>
      <button onclick="setSpeed(60)">60倍</button>
      <button onclick="resetToRealTime()">実時刻同期</button>
    </div>
  </div>
</div>

<script>
(function() {
  var dialGroup = document.getElementById("dialGroup");
  var hourGroup = document.getElementById("hourGroup");
  var minGroup = document.getElementById("minGroup");
  var secGroup = document.getElementById("secGroup");
  var capGroup = document.getElementById("capGroup");
  var digitalTimeEl = document.getElementById("digitalTime");

  var speedRange = document.getElementById("speedRange");
  var speedInput = document.getElementById("speedInput");
  var pauseBtn = document.getElementById("pauseBtn");
  var targetHour = document.getElementById("targetHour");
  var targetMin = document.getElementById("targetMin");
  var targetSec = document.getElementById("targetSec");

  var speed = 1.0;
  var virtualTime = Date.now();
  var lastRealTime = Date.now();
  var isPaused = false;

  var now = new Date();
  targetHour.value = ("0" + now.getHours()).slice(-2);
  targetMin.value = ("0" + now.getMinutes()).slice(-2);
  targetSec.value = ("0" + now.getSeconds()).slice(-2);

  speedRange.addEventListener("input", function(e) {
    speed = parseFloat(e.target.value);
    speedInput.value = speed;
  });
  speedInput.addEventListener("input", function(e) {
    speed = Math.max(0, parseFloat(e.target.value) || 0);
    speedRange.value = speed;
  });

  window.setSpeed = function(v) {
    speed = v;
    speedRange.value = v;
    speedInput.value = v;
  };
  window.resetToRealTime = function() {
    virtualTime = Date.now();
    lastRealTime = Date.now();
  };
  window.applyTargetTime = function() {
    var h = parseInt(targetHour.value, 10) || 0;
    var m = parseInt(targetMin.value, 10) || 0;
    var s = parseInt(targetSec.value, 10) || 0;
    var d = new Date(virtualTime);
    d.setHours(h, m, s, 0);
    virtualTime = d.getTime();
    lastRealTime = Date.now();
  };
  window.togglePause = function() {
    isPaused = !isPaused;
    if (isPaused) {
      pauseBtn.textContent = "再開";
      pauseBtn.style.background = "#ef4444";
    } else {
      pauseBtn.textContent = "一時停止";
      pauseBtn.style.background = "#2563eb";
      lastRealTime = Date.now();
    }
  };

  // 10大ブランドごとの文字盤・針セットアップ
  window.changeTheme = function(key) {
    var dialHTML = "";
    var hourHTML = "";
    var minHTML = "";
    var secHTML = "";
    var capHTML = "";

    if (key === "franck") {
      // 1. フランク ミュラー（カサブランカ・トノウ カーベックス）
      dialHTML = `
        <!-- トノウ型外殻＆ブラックダイアル -->
        <rect x="10" y="10" width="340" height="340" rx="60" fill="#0b0b0e" stroke="#475569" stroke-width="4"/>
        <path d="M 180,26 C 290,26 324,80 324,180 C 324,280 290,334 180,334 C 70,334 36,280 36,180 C 36,80 70,26 180,26 Z" fill="#121318" stroke="#334155" stroke-width="2.5"/>
        <!-- 象徴的な歪曲ビザン数字（角度・変形比率個別チューニング） -->
        <g fill="#e2d9cc" font-family="'Times New Roman', Georgia, serif" font-weight="900" text-anchor="middle">
          <text x="180" y="74" font-size="46" transform="scale(1.0, 1.45) translate(0, -18)">12</text>
          <text x="246" y="90" font-size="44" transform="rotate(22 246 90) scale(0.9, 1.4)">1</text>
          <text x="290" y="136" font-size="44" transform="rotate(45 290 136) scale(0.95, 1.35)">2</text>
          <text x="302" y="196" font-size="52" transform="scale(1.4, 1.0) translate(-65, 0)">3</text>
          <text x="288" y="250" font-size="44" transform="rotate(-40 288 250) scale(0.95, 1.35)">4</text>
          <text x="242" y="296" font-size="44" transform="rotate(-20 242 296) scale(0.9, 1.4)">5</text>
          <text x="180" y="240" font-size="52" transform="scale(1.0, 1.45) translate(0, -12)">6</text>
          <text x="118" y="296" font-size="44" transform="rotate(20 118 296) scale(0.9, 1.4)">7</text>
          <text x="72" y="250" font-size="44" transform="rotate(40 72 250) scale(0.95, 1.35)">8</text>
          <text x="58" y="196" font-size="52" transform="scale(1.4, 1.0) translate(14, 0)">9</text>
          <text x="70" y="136" font-size="44" transform="rotate(-45 70 136) scale(0.95, 1.35)">10</text>
          <text x="114" y="90" font-size="44" transform="rotate(-22 114 90) scale(0.9, 1.4)">11</text>
        </g>
        <!-- ロゴ＆アーチ文字 -->
        <path id="fmCurve" d="M 125,124 Q 180,106 235,124" fill="none"/>
        <text font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#f1f5f9" letter-spacing="1.5">
          <textPath href="#fmCurve" startOffset="50%" text-anchor="middle">FRANCK MULLER</textPath>
        </text>
        <text x="180" y="136" text-anchor="middle" font-family="'Times New Roman', serif" font-size="7.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">GENEVE</text>
        <text x="180" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#e2d9cc" letter-spacing="1.5">CASABLANCA</text>
      `;
      // ブルースチール・スペード／リーフ針
      hourHTML = `<path d="M 180,180 L 174,150 Q 172,120 180,95 Q 188,120 186,150 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>`;
      minHTML  = `<path d="M 180,180 L 175,140 Q 173,85 180,52 Q 187,85 185,140 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>`;
      secHTML  = `<line x1="180" y1="210" x2="180" y2="40" stroke="#38bdf8" stroke-width="1.4"/><circle cx="180" cy="70" r="3" fill="#38bdf8"/>`;
      capHTML  = `<circle cx="180" cy="180" r="4.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>`;

    } else if (key === "rolex") {
      // 2. ロレックス（デイトナ）
      dialHTML = `
        <circle cx="180" cy="180" r="176" fill="#0a0a0c" stroke="#334155" stroke-width="3"/>
        <circle cx="180" cy="180" r="148" fill="#0d0e12" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <text x="180" y="24" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e2e8f0" letter-spacing="1">UNITS PER HOUR 400</text>
        <text x="342" y="183" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e2e8f0">120</text>
        <text x="180" y="348" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e2e8f0">80</text>
        <text x="18" y="183" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e2e8f0">60</text>
        <use href="#daytonaSubDial" x="240" y="180"/>
        <use href="#daytonaSubDial" x="120" y="180"/>
        <use href="#daytonaSubDial" x="180" y="236"/>

        <text x="180" y="104" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#ffffff">ROLEX</text>
        <text x="180" y="115" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#cbd5e1" letter-spacing="1">OYSTER PERPETUAL</text>
        <text x="180" y="124" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#94a3b8">SUPERLATIVE CHRONOMETER</text>
        <text x="180" y="196" text-anchor="middle" font-size="8" font-weight="bold" fill="#ef4444" letter-spacing="0.5">DAYTONA</text>
        <rect x="226" y="58" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(30 228 65)"/>
        <rect x="268" y="100" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(60 270 107)"/>
        <rect x="268" y="246" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(120 270 253)"/>
        <rect x="226" y="288" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(150 228 295)"/>
        <rect x="129" y="288" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(210 131 295)"/>
        <rect x="87" y="246" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(240 89 253)"/>
        <rect x="87" y="100" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(300 89 107)"/>
        <rect x="129" y="58" width="5" height="14" rx="1" fill="#e2e8f0" transform="rotate(330 131 65)"/>
      `;
      hourHTML = `<rect x="176.5" y="100" width="7" height="84" rx="2" fill="#e2e8f0"/><rect x="178.5" y="106" width="3" height="60" rx="1" fill="#93c5fd"/>`;
      minHTML  = `<rect x="177.5" y="60" width="5" height="124" rx="1.5" fill="#e2e8f0"/><rect x="179" y="66" width="2" height="96" rx="1" fill="#93c5fd"/>`;
      secHTML  = `<line x1="180" y1="210" x2="180" y2="40" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/><circle cx="180" cy="75" r="3.5" fill="#ef4444"/>`;
      capHTML  = `<circle cx="180" cy="180" r="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>`;

    } else if (key === "ap") {
      // 3. オーデマ ピゲ（ロイヤル オーク）
      dialHTML = `
        <polygon points="180,6 295,54 345,180 295,306 180,354 65,306 15,180 65,54" fill="#1e222d" stroke="#64748b" stroke-width="6"/>
        <!-- 8角形固定ビス -->
        <circle cx="65" cy="54" r="5" fill="#94a3b8"/><circle cx="295" cy="54" r="5" fill="#94a3b8"/>
        <circle cx="345" cy="180" r="5" fill="#94a3b8"/><circle cx="295" cy="306" r="5" fill="#94a3b8"/>
        <circle cx="180" cy="354" r="5" fill="#94a3b8"/><circle cx="65" cy="306" r="5" fill="#94a3b8"/>

        <rect x="296" y="177.5" width="20" height="5" fill="#e2e8f0"/>
        <rect x="177.5" y="296" width="5" height="20" fill="#e2e8f0"/>
        <rect x="44" y="177.5" width="20" height="5" fill="#e2e8f0"/>
      `;
      hourHTML = `<rect x="176" y="95" width="8" height="90" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect x="178.5" y="102" width="3" height="65" rx="1.5" fill="#94a3b8"/>`;
      minHTML  = `<rect x="177" y="55" width="6" height="130" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect x="179" y="62" width="2" height="100" rx="1" fill="#94a3b8"/>`;
      secHTML  = `<line x1="180" y1="210" x2="180" y2="40" stroke="#cbd5e1" stroke-width="1.2"/>`;
      capHTML  = `<circle cx="180" cy="180" r="4.5" fill="#cbd5e1"/>`;

    } else if (key === "patek") {
      // 4. パテック フィリップ（ノーチラス）
      dialHTML = `
        <rect x="15" y="15" width="330" height="330" rx="80" fill="#0d1f33" stroke="#475569" stroke-width="8"/>
        <rect x="25" y="25" width="310" height="310" rx="70" fill="url(#nautilusPattern)" stroke="#1e3a5f" stroke-width="2"/>
        <text x="180" y="115" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">PATEK PHILIPPE</text>
        <text x="180" y="128" text-anchor="middle" font-size="7" font-weight="bold" fill="#94a3b8" letter-spacing="1">GENEVE</text>
        <rect x="175" y="52" width="4" height="22" rx="2" fill="#e2e8f0"/><rect x="181" y="52" width="4" height="22" rx="2" fill="#e2e8f0"/>
        <rect x="286" y="177" width="22" height="6" rx="2" fill="#e2e8f0"/>
        <rect x="177" y="286" width="6" height="22" rx="2" fill="#e2e8f0"/>
        <rect x="52" y="177" width="22" height="6" rx="2" fill="#e2e8f0"/>
      `;
      hourHTML = `<rect x="176" y="98" width="8" height="88" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><rect x="178.5" y="104" width="3" height="65" rx="1.5" fill="#67e8f9"/>`;
      minHTML  = `<rect x="177" y="58" width="6" height="128" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><rect x="179" y="64" width="2" height="100" rx="1" fill="#67e8f9"/>`;
      secHTML  = `<line x1="180" y1="210" x2="180" y2="38" stroke="#ffffff" stroke-width="1.2"/>`;
      capHTML  = `<circle cx="180" cy="180" r="4" fill="#ffffff"/>`;

    } else if (key === "panerai") {

  function update() {
    var nowTime = Date.now();
    var delta = nowTime - lastRealTime;
    lastRealTime = nowTime;

    if (!isPaused) {
      virtualTime += delta * speed;
    }

    var d = new Date(virtualTime);
    var ms = d.getMilliseconds();
    var s = d.getSeconds() + ms / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;

    hourGroup.setAttribute("transform", "rotate(" + (h * 30) + " 180 180)");
    minGroup.setAttribute("transform", "rotate(" + (m * 6) + " 180 180)");
    secGroup.setAttribute("transform", "rotate(" + (s * 6) + " 180 180)");

    var hh = ("0" + d.getHours()).slice(-2);
    var mm = ("0" + d.getMinutes()).slice(-2);
    var ss = ("0" + Math.floor(s)).slice(-2);
    digitalTimeEl.textContent = hh + ":" + mm + ":" + ss;

    requestAnimationFrame(update);
  }

  // 初期文字盤生成＆アニメーション起動
  changeTheme("franck");
  requestAnimationFrame(update);

  // PWA用インライン Service Worker
  if ("serviceWorker" in navigator) {
    var swCode = `
      var CACHE_NAME = 'real-clock-v2';
      self.addEventListener('install', function(e) { self.skipWaiting(); });
      self.addEventListener('activate', function(e) { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', function(e) {
        e.respondWith(
          fetch(e.request).then(function(res) {
            var copy = res.clone();
            caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
            return res;
          }).catch(function() { return caches.match(e.request); })
        );
      });
    `;
    var blob = new Blob([swCode], { type: "application/javascript" });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function() {});
  }
})();
