<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>究極再現・世界の時計コレクション</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="名機クロック">

  <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIueptumjqOWGjeePv+OCquODvODgODXjg7vjgq/jg63ODg+OCryIsCiAgInNob3J0X25hbWUiOiAi44Kv44Ot44OD44KvIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwNTA2MDgiLAogICJ0aGVtZV9jb2xvciIjogIiMwNTA2MDgiCn0=">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 98vh;
      background-color: #050608;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #161820 0%, #08090d 100%);
      padding: 18px 14px;
      border-radius: 28px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.95), inset 0 1px 1px rgba(255,255,255,0.12);
      width: 100%;
      max-width: 480px;
    }
    .clock-svg {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.85));
      display: block;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 13px; font-weight: bold; color: #94a3b8; }
    select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      max-width: 100%;
    }
    input[type="range"] { width: 130px; cursor: pointer; }
    input[type="number"] {
      width: 65px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      text-align: right;
    }
    .time-input { width: 44px !important; text-align: center !important; }
    .digital-readout {
      margin: 6px 0;
      font-size: 26px;
      font-family: "SF Mono", "Courier New", monospace;
      color: #cbd5e1;
      letter-spacing: 2px;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div class="container">
  <svg class="clock-svg" viewBox="0 0 360 360" id="clockSVG">
    <defs>
      <!-- デイトナ・サブダイヤル -->
      <g id="daytonaSubDial">
        <circle cx="0" cy="0" r="32" fill="#0b0c10" stroke="#cbd5e1" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="-30" x2="0" y2="-24" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="0" y1="30" x2="0" y2="24" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="-30" y1="0" x2="-24" y2="0" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="30" y1="0" x2="24" y2="0" stroke="#cbd5e1" stroke-width="1.2"/>
        <line x1="0" y1="2" x2="0" y2="-20" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- オメガ スピードマスター・スネイル同心円メーター部品 -->
      <g id="speedySubDial3">
        <circle cx="0" cy="0" r="31" fill="#0a0a0c" stroke="#1f232b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="21" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="11" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <!-- 目盛り線 -->
        <line x1="0" y1="-30" x2="0" y2="-23" stroke="#e2e8f0" stroke-width="1.2"/>
        <line x1="26" y1="-15" x2="20" y2="-11.5" stroke="#94a3b8" stroke-width="0.8"/>
        <line x1="26" y1="15" x2="20" y2="11.5" stroke="#94a3b8" stroke-width="0.8"/>
        <line x1="0" y1="30" x2="0" y2="23" stroke="#94a3b8" stroke-width="0.8"/>
        <line x1="-26" y1="15" x2="-20" y2="11.5" stroke="#94a3b8" stroke-width="0.8"/>
        <line x1="-26" y1="-15" x2="-20" y2="-11.5" stroke="#94a3b8" stroke-width="0.8"/>
        <!-- 数字 10, 20, 30 -->
        <text x="0" y="-14" text-anchor="middle" font-size="6.5" font-family="'Helvetica Neue', sans-serif" font-weight="bold" fill="#f8fafc">30</text>
        <text x="17" y="11" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">10</text>
        <text x="-17" y="11" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">20</text>
        <line x1="0" y1="3" x2="0" y2="-19" stroke="#ffffff" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
      </g>

      <g id="speedySubDial6">
        <circle cx="0" cy="0" r="31" fill="#0a0a0c" stroke="#1f232b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="21" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="11" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <!-- 目盛り線 -->
        <line x1="0" y1="-30" x2="0" y2="-23" stroke="#e2e8f0" stroke-width="1.2"/>
        <line x1="30" y1="0" x2="23" y2="0" stroke="#e2e8f0" stroke-width="1.2"/>
        <line x1="0" y1="30" x2="0" y2="23" stroke="#e2e8f0" stroke-width="1.2"/>
        <line x1="-30" y1="0" x2="-23" y2="0" stroke="#e2e8f0" stroke-width="1.2"/>
        <!-- 数字 3, 6, 9, 12 -->
        <text x="0" y="-14" text-anchor="middle" font-size="6.5" font-family="'Helvetica Neue', sans-serif" font-weight="bold" fill="#f8fafc">12</text>
        <text x="17" y="2.5" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">3</text>
        <text x="0" y="20" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">6</text>
        <text x="-17" y="2.5" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">9</text>
        <line x1="0" y1="3" x2="0" y2="-19" stroke="#ffffff" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
      </g>

      <g id="speedySubDial9">
        <circle cx="0" cy="0" r="31" fill="#0a0a0c" stroke="#1f232b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="21" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="11" fill="none" stroke="#22252e" stroke-width="0.7"/>
        <!-- 目盛り線 -->
        <line x1="0" y1="-30" x2="0" y2="-23" stroke="#e2e8f0" stroke-width="1.2"/>
        <line x1="0" y1="30" x2="0" y2="23" stroke="#94a3b8" stroke-width="0.8"/>
        <!-- 数字 20, 40, 60 -->
        <text x="0" y="-14" text-anchor="middle" font-size="6.5" font-family="'Helvetica Neue', sans-serif" font-weight="bold" fill="#f8fafc">60</text>
        <text x="17" y="11" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">20</text>
        <text x="-17" y="11" text-anchor="middle" font-size="6" font-family="'Helvetica Neue', sans-serif" fill="#cbd5e1">40</text>
        <line x1="0" y1="3" x2="0" y2="-19" stroke="#ffffff" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
      </g>

      <!-- ROLEX 王冠マーク -->
      <g id="rolexCoronet">
        <path d="M-10,0 L-13,-18 L-5,-9 L0,-22 L5,-9 L13,-18 L10,0 Z" fill="#eab308" stroke="#ca8a04" stroke-width="0.8"/>
        <circle cx="-13" cy="-19" r="1.8" fill="#eab308"/>
        <circle cx="-5" cy="-10" r="1.5" fill="#eab308"/>
        <circle cx="0" cy="-23" r="2" fill="#eab308"/>
        <circle cx="5" cy="-10" r="1.5" fill="#eab308"/>
        <circle cx="13" cy="-19" r="1.8" fill="#eab308"/>
        <ellipse cx="0" cy="1" rx="9" ry="2.5" fill="#eab308" stroke="#ca8a04" stroke-width="0.8"/>
      </g>

      <!-- AP タペストリー格子パターン -->
      <pattern id="apPattern" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="13" height="13" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
        <rect x="2" y="2" width="9" height="9" fill="#334155"/>
      </pattern>

      <!-- パテック 横ボーダーパターン -->
      <pattern id="nautilusPattern" width="360" height="10" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="360" y2="0" stroke="#0f172a" stroke-width="3"/>
        <line x1="0" y1="5" x2="360" y2="5" stroke="#1e3a5f" stroke-width="7"/>
      </pattern>
    </defs>

    <!-- レイヤー1: 文字盤 -->
    <g id="dialGroup"></g>

    <!-- レイヤー2: 針（時・分・秒・センターピン） -->
    <g id="hourGroup"></g>
    <g id="minGroup"></g>
    <g id="secGroup"></g>
    <g id="capGroup"></g>
  </svg>
  
  <div class="digital-readout" id="digitalTime">00:00:00</div>

  <div class="controls">
    <div class="control-row">
      <label for="themeSelector">デザイン選択:</label>
      <select id="themeSelector" onchange="changeTheme(this.value)">
        <option value="omega" selected>★ オメガ（スピードマスター ムーンウォッチ・完全再現）</option>
        <option value="plain">0. スタンダード（シンプル・無地白）</option>
        <option value="casio_mq">1. チープカシオ（CASIO スタンダード MQ-24）</option>
        <option value="timex">2. タイメックス（TIMEX ウィークエンダー 24時間計）</option>
        <option value="swatch">3. スウォッチ（Swatch ポップカラー）</option>
        <option value="gshock">4. G-SHOCK（2100 オクタゴン八角ベゼル）</option>
        <option value="franck">5. フランク ミュラー（トノウ カーベックス カサブランカ）</option>
        <option value="rolex">6. ロレックス（コスモグラフ デイトナ）</option>
        <option value="ap">7. オーデマ ピゲ（ロイヤル オーク）</option>
        <option value="patek">8. パテック フィリップ（ノーチラス）</option>
        <option value="panerai">9. パネライ（ルミノール サンドイッチ）</option>
        <option value="cartier">10. カルティエ（サントス ローマン＆青焼き針）</option>
        <option value="iwc">11. IWC（ポルトギーゼ クロノグラフ）</option>
        <option value="breitling">12. ブライトリング（ナビタイマー 航空計算尺）</option>
        <option value="gs">13. グランドセイコー（白樺 / 雪白 ドーフィン針）</option>
      </select>
    </div>

    <div class="control-row">
      <label>時刻指定:</label>
      <input type="number" id="targetHour" class="time-input" min="0" max="23" value="10">
      <span>:</span>
      <input type="number" id="targetMin" class="time-input" min="0" max="59" value="10">
      <span>:</span>
      <input type="number" id="targetSec" class="time-input" min="0" max="59" value="30">
      <button onclick="applyTargetTime()">設定</button>
      <button id="pauseBtn" onclick="togglePause()">一時停止</button>
    </div>

    <div class="control-row">
      <label for="speedRange">倍速:</label>
      <input type="range" id="speedRange" min="0" max="60" step="0.5" value="1">
      <input type="number" id="speedInput" min="0" max="3600" step="0.5" value="1">
      <span>倍</span>
    </div>

    <div class="button-group">
      <button onclick="setSpeed(1)">等倍</button>
      <button onclick="setSpeed(2)">2倍</button>
      <button onclick="setSpeed(10)">10倍</button>
      <button onclick="setSpeed(60)">60倍</button>
      <button onclick="resetToRealTime()">実時刻同期</button>
    </div>
  </div>
</div>

<script>
(function() {
  var dialGroup = document.getElementById("dialGroup");
  var hourGroup = document.getElementById("hourGroup");
  var minGroup = document.getElementById("minGroup");
  var secGroup = document.getElementById("secGroup");
  var capGroup = document.getElementById("capGroup");
  var digitalTimeEl = document.getElementById("digitalTime");

  var speedRange = document.getElementById("speedRange");
  var speedInput = document.getElementById("speedInput");
  var pauseBtn = document.getElementById("pauseBtn");
  var targetHour = document.getElementById("targetHour");
  var targetMin = document.getElementById("targetMin");
  var targetSec = document.getElementById("targetSec");

  var speed = 1.0;
  var virtualTime = Date.now();
  var lastRealTime = Date.now();
  var isPaused = false;

  var now = new Date();
  targetHour.value = ("0" + now.getHours()).slice(-2);
  targetMin.value = ("0" + now.getMinutes()).slice(-2);
  targetSec.value = ("0" + now.getSeconds()).slice(-2);

  speedRange.addEventListener("input", function(e) {
    speed = parseFloat(e.target.value);
    speedInput.value = speed;
  });
  speedInput.addEventListener("input", function(e) {
    speed = Math.max(0, parseFloat(e.target.value) || 0);
    speedRange.value = speed;
  });

  window.setSpeed = function(v) {
    speed = v;
    speedRange.value = v;
    speedInput.value = v;
  };
  window.resetToRealTime = function() {
    virtualTime = Date.now();
    lastRealTime = Date.now();
  };
  window.applyTargetTime = function() {
    var h = parseInt(targetHour.value, 10) || 0;
    var m = parseInt(targetMin.value, 10) || 0;
    var s = parseInt(targetSec.value, 10) || 0;
    var d = new Date(virtualTime);
    d.setHours(h, m, s, 0);
    virtualTime = d.getTime();
    lastRealTime = Date.now();
  };
  window.togglePause = function() {
    isPaused = !isPaused;
    if (isPaused) {
      pauseBtn.textContent = "再開";
      pauseBtn.style.background = "#ef4444";
    } else {
      pauseBtn.textContent = "一時停止";
      pauseBtn.style.background = "#2563eb";
      lastRealTime = Date.now();
    }
  };

  window.changeTheme = function(key) {
    var dialHTML = "";
    var hourHTML = "";
    var minHTML = "";
    var secHTML = "";
    var capHTML = "";

    if (key === "omega") {
      // ★ オメガ（スピードマスター ムーンウォッチ・実機完全再現）
      dialHTML = `
        <!-- 外装タキメーターベゼル（Dot Over 90刻印） -->
        <circle cx="180" cy="180" r="176" fill="#08080a" stroke="#2d3139" stroke-width="3"/>
        <circle cx="180" cy="180" r="148" fill="#111215" stroke="#1f232b" stroke-width="2"/>
        
        <!-- ベゼル・タキメーター刻印 -->
        <text x="180" y="24" text-anchor="middle" font-size="8.5" font-family="'Helvetica Neue', sans-serif" font-weight="900" fill="#f8fafc" letter-spacing="1">TACHYMÈTRE 500</text>
        <text x="268" y="44" text-anchor="middle" font-size="7" font-weight="bold" fill="#cbd5e1">300</text>
        <text x="328" y="122" text-anchor="middle" font-size="7" font-weight="bold" fill="#cbd5e1">200</text>
        <text x="345" y="183" text-anchor="middle" font-size="8" font-weight="bold" fill="#cbd5e1">120</text>
        <text x="268" y="325" text-anchor="middle" font-size="7" font-weight="bold" fill="#cbd5e1">90</text>
        <circle cx="277" cy="319" r="1" fill="#cbd5e1"/><!-- Dot Over 90 -->
        <text x="180" y="349" text-anchor="middle" font-size="8" font-weight="bold" fill="#cbd5e1">75</text>
        <text x="18" y="183" text-anchor="middle" font-size="8" font-weight="bold" fill="#cbd5e1">60</text>

        <!-- ステップダイヤル段差落ち込み（外周シャドウ） -->
        <circle cx="180" cy="180" r="146" fill="#141518"/>
        <circle cx="180" cy="180" r="132" fill="#0b0c0e" stroke="#000000" stroke-width="3"/>

        <!-- 外周 1/5秒精密ミニッツトラック -->
        <circle cx="180" cy="180" r="136" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-dasharray="0.8, 2.76" opacity="0.6"/>

        <!-- 3連スネイル同心円メーター（3時:30分計、6時:12時間計、9時:スモールセコンド） -->
        <use href="#speedySubDial3" x="242" y="180"/>
        <use href="#speedySubDial6" x="180" y="238"/>
        <use href="#speedySubDial9" x="118" y="180"/>

        <!-- OMEGA ロゴ & 4行レタリング -->
        <text x="180" y="94" text-anchor="middle" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#ffffff">Ω</text>
        <text x="180" y="108" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">OMEGA</text>
        <text x="180" y="120" text-anchor="middle" font-family="'Brush Script MT', cursive, serif" font-size="11.5" font-style="italic" fill="#ffffff">Speedmaster</text>
        <text x="180" y="129" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="6.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">PROFESSIONAL</text>

        <!-- 12時ダブルドット夜光 & 縦バー -->
        <line x1="180" y1="48" x2="180" y2="68" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="174" cy="54" r="2.2" fill="#fef08a"/>
        <circle cx="186" cy="54" r="2.2" fill="#fef08a"/>

        <!-- 各時インデックス（アイボリー蓄光バトン） -->
        <line x1="246" y1="71" x2="236" y2="88" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="289" y1="117" x2="272" y2="127" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="289" y1="243" x2="272" y2="233" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="246" y1="289" x2="236" y2="272" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="114" y1="289" x2="124" y2="272" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="71" y1="243" x2="88" y2="233" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="71" y1="117" x2="88" y2="127" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <line x1="114" y1="71" x2="124" y2="88" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      `;
      // 実機プロフェッショナル・ホワイトバトン針 & 菱形アロー秒針
      hourHTML = `
        <rect x="176.5" y="105" width="7" height="75" rx="1.5" fill="#ffffff"/>
        <rect x="178" y="112" width="4" height="55" rx="1" fill="#fef08a"/>
      `;
      minHTML  = `
        <rect x="177" y="55" width="6" height="125" rx="1.5" fill="#ffffff"/>
        <rect x="178.5" y="62" width="3" height="95" rx="1" fill="#fef08a"/>
      `;
      secHTML  = `
        <!-- 末端カウンターウェイト＆極細ホワイトアロー秒針 -->
        <line x1="180" y1="210" x2="180" y2="40" stroke="#ffffff" stroke-width="1.2"/>
        <circle cx="180" cy="202" r="2.5" fill="#ffffff"/>
        <!-- 菱形アローヘッド（蓄光ドット内蔵） -->
        <polygon points="180,56 176,64 180,72 184,64" fill="#ffffff"/>

  function update() {
    var nowTime = Date.now();
    var delta = nowTime - lastRealTime;
    lastRealTime = nowTime;

    if (!isPaused) {
      virtualTime += delta * speed;
    }

    var d = new Date(virtualTime);
    var ms = d.getMilliseconds();
    var s = d.getSeconds() + ms / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;

    hourGroup.setAttribute("transform", "rotate(" + (h * 30) + " 180 180)");
    minGroup.setAttribute("transform", "rotate(" + (m * 6) + " 180 180)");
    secGroup.setAttribute("transform", "rotate(" + (s * 6) + " 180 180)");

    var hh = ("0" + d.getHours()).slice(-2);
    var mm = ("0" + d.getMinutes()).slice(-2);
    var ss = ("0" + Math.floor(s)).slice(-2);
    digitalTimeEl.textContent = hh + ":" + mm + ":" + ss;

    requestAnimationFrame(update);
  }

  // 初期表示を新オメガに設定
  changeTheme("omega");
  requestAnimationFrame(update);

  if ("serviceWorker" in navigator) {
    var swCode = `
      var CACHE_NAME = 'real-clock-v4';
      self.addEventListener('install', function(e) { self.skipWaiting(); });
      self.addEventListener('activate', function(e) { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', function(e) {
        e.respondWith(
          fetch(e.request).then(function(res) {
            var copy = res.clone();
            caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
            return res;
          }).catch(function() { return caches.match(e.request); })
        );
      });
    `;
    var blob = new Blob([swCode], { type: "application/javascript" });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function() {});
  }
})();
