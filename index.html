<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>究極再現・世界の時計コレクション</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="名機クロック">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 98vh;
      background-color: #050608;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #161820 0%, #08090d 100%);
      padding: 18px 14px;
      border-radius: 28px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.95), inset 0 1px 1px rgba(255,255,255,0.12);
      width: 100%;
      max-width: 480px;
    }
    .clock-svg {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.85));
      display: block;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 13px; font-weight: bold; color: #94a3b8; }
    select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      max-width: 100%;
    }
    input[type="range"] { width: 130px; cursor: pointer; }
    input[type="number"] {
      width: 65px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      text-align: right;
    }
    .time-input { width: 44px !important; text-align: center !important; }
    .digital-readout {
      margin: 6px 0;
      font-size: 26px;
      font-family: "SF Mono", "Courier New", monospace;
      color: #cbd5e1;
      letter-spacing: 2px;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div class="container">
  <svg class="clock-svg" viewBox="0 0 360 360" id="clockSVG">
    <defs>
      <!-- GS SLGB023 スクショ完全一致グラデーション -->
      <radialGradient id="gsUshioDial" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1b5c96"/>
        <stop offset="45%" stop-color="#0f3d68"/>
        <stop offset="80%" stop-color="#07213b"/>
        <stop offset="100%" stop-color="#030f1c"/>
      </radialGradient>

      <!-- GS ダイバー専用 実機完全一致・極太カット台形インデックス（縦方向） -->
      <g id="gsIndexV">
        <polygon points="-8,-14 8,-14 9.5,14 -9.5,14" fill="#cbd5e1" stroke="#334155" stroke-width="0.8"/>
        <polygon points="-5.5,-11.5 5.5,-11.5 6.8,11.5 -6.8,11.5" fill="#f8fafc"/>
        <line x1="0" y1="-11" x2="0" y2="11" stroke="#94a3b8" stroke-width="1"/>
      </g>

      <!-- GS ダイバー専用 実機完全一致・極太ブロックインデックス（横方向） -->
      <g id="gsIndexH">
        <polygon points="-14,-8 14,-8 14,8 -14,8" fill="#cbd5e1" stroke="#334155" stroke-width="0.8"/>
        <polygon points="-11.5,-5.5 11.5,-5.5 11.5,5.5 -11.5,5.5" fill="#f8fafc"/>
        <line x1="-11" y1="0" x2="11" y2="0" stroke="#94a3b8" stroke-width="1"/>
      </g>

      <!-- 他モデル用共通リソース -->
      <radialGradient id="subSunray" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1e222a"/><stop offset="100%" stop-color="#050607"/></radialGradient>
      <radialGradient id="monacoBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1d4076"/><stop offset="85%" stop-color="#0d2142"/><stop offset="100%" stop-color="#061224"/></radialGradient>
      <g id="subDotIndex"><circle cx="0" cy="0" r="6.2" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/><circle cx="0" cy="0" r="4.8" fill="#f8fafc"/></g>
      <g id="subBatonIndex"><rect x="-3.5" y="-11" width="7" height="22" rx="1" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/><rect x="-2.2" y="-9.5" width="4.4" height="19" rx="0.5" fill="#f8fafc"/></g>
      <g id="vacheronCross"><path d="M 0,-14 L 3,-4 L 14,-3 L 6,4 L 10,14 L 0,8 L -10,14 L -6,4 L -14,-3 L -3,-4 Z" fill="#d4af37" stroke="#b45309" stroke-width="0.6"/></g>
      <g id="vcRuby"><circle cx="0" cy="0" r="3.2" fill="#be123c" stroke="#fb7185" stroke-width="0.8"/><circle cx="0" cy="0" r="1.4" fill="#881337"/><circle cx="0.8" cy="-0.8" r="0.6" fill="#ffffff" opacity="0.8"/></g>
      <g id="vcTourbillon"><circle cx="0" cy="0" r="42" fill="#090a0f" stroke="#e2e8f0" stroke-width="1.8"/><circle cx="0" cy="0" r="35" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-dasharray="2, 6"/><circle cx="0" cy="0" r="28" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M 0,-34 L 5,-12 L 20,-28 L 12,-5 L 34,0 L 12,5 L 20,28 L 5,12 L 0,34 L -5,12 L -20,28 L -12,5 L -34,0 L -12,-5 L -20,-28 L -5,-12 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1"/><circle cx="0" cy="0" r="8" fill="#cbd5e1"/><use href="#vcRuby" x="0" y="0"/></g>
    </defs>

    <g id="dialGroup"></g>
    <g id="subSecGroup"></g>
    <g id="hourGroup"></g>
    <g id="minGroup"></g>
    <g id="secGroup"></g>
    <g id="capGroup"></g>
  </svg>
  
  <div class="digital-readout" id="digitalTime">00:00:00</div>

  <div class="controls">
    <div class="control-row">
      <label for="themeSelector">デザイン選択:</label>
      <select id="themeSelector" onchange="changeTheme(this.value)">
        <option value="gs_ushio_exact" selected>★ グランドセイコー（Ushio 300 SLGB023・スクショ完全一致版）</option>
        <option value="rolex_submariner">★ ロレックス（サブマリーナー デイト 126610LN）</option>
        <option value="heuer_monaco">★ タグ・ホイヤー（モナコ キャリバー11・スモセコ機構）</option>
        <option value="rolex_panda">★ ロレックス（デイトナ パンダ 126500LN・6時スモセコ機構）</option>
        <option value="omega_pro">★ オメガ（スピードマスター ムーンウォッチ・9時スモセコ機構）</option>
        <option value="fm_colordreams">★ フランク ミュラー（トノウ カーベックス カラードリーム）</option>
        <option value="vc_cabinotiers">★ ヴァシュロン・コンスタンタン（レ・キャビノティエ）</option>
        <option value="plain">0. スタンダード（シンプル・無地白）</option>
        <option value="casio_mq">1. チープカシオ（CASIO MQ-24）</option>
        <option value="timex">2. タイメックス（ウィークエンダー）</option>
        <option value="swatch">3. スウォッチ（ポップカラー）</option>
        <option value="gshock">4. G-SHOCK（GA-2100 オクタゴン）</option>
        <option value="patek">5. パテック フィリップ（ノーチラス 5711）</option>
        <option value="cartier">6. カルティエ（サントス ドゥ カルティエ）</option>
        <option value="breitling">7. ブライトリング（ナビタイマー B01）</option>
      </select>
    </div>

    <div class="control-row">
      <label>時刻指定:</label>
      <input type="number" id="targetHour" class="time-input" min="0" max="23" value="10">
      <span>:</span>
      <input type="number" id="targetMin" class="time-input" min="0" max="59" value="10">
      <span>:</span>
      <input type="number" id="targetSec" class="time-input" min="0" max="59" value="30">
      <button onclick="applyTargetTime()">設定</button>
      <button id="pauseBtn" onclick="togglePause()">一時停止</button>
    </div>

    <div class="control-row">
      <label for="speedRange">倍速:</label>
      <input type="range" id="speedRange" min="0" max="60" step="0.5" value="1">
      <input type="number" id="speedInput" min="0" max="3600" step="0.5" value="1">
      <span>倍</span>
    </div>

    <div class="button-group">
      <button onclick="setSpeed(1)">等倍</button>
      <button onclick="setSpeed(2)">2倍</button>
      <button onclick="setSpeed(10)">10倍</button>
      <button onclick="setSpeed(60)">60倍</button>
      <button onclick="resetToRealTime()">実時刻同期</button>
    </div>
  </div>
</div>

<script>
(function() {
  var dialGroup = document.getElementById("dialGroup");
  var subSecGroup = document.getElementById("subSecGroup");
  var hourGroup = document.getElementById("hourGroup");
  var minGroup = document.getElementById("minGroup");
  var secGroup = document.getElementById("secGroup");
  var capGroup = document.getElementById("capGroup");
  var digitalTimeEl = document.getElementById("digitalTime");

  var speedRange = document.getElementById("speedRange");
  var speedInput = document.getElementById("speedInput");
  var pauseBtn = document.getElementById("pauseBtn");
  var targetHour = document.getElementById("targetHour");
  var targetMin = document.getElementById("targetMin");
  var targetSec = document.getElementById("targetSec");

  var currentTheme = "gs_ushio_exact";
  var speed = 1.0;
  var virtualTime = Date.now();
  var lastRealTime = Date.now();
  var isPaused = false;

  var now = new Date();
  targetHour.value = ("0" + now.getHours()).slice(-2);
  targetMin.value = ("0" + now.getMinutes()).slice(-2);
  targetSec.value = ("0" + now.getSeconds()).slice(-2);

  speedRange.addEventListener("input", function(e) {
    speed = parseFloat(e.target.value);
    speedInput.value = speed;
  });
  speedInput.addEventListener("input", function(e) {
    speed = Math.max(0, parseFloat(e.target.value) || 0);
    speedRange.value = speed;
  });

  window.setSpeed = function(v) {
    speed = v;
    speedRange.value = v;
    speedInput.value = v;
  };
  window.resetToRealTime = function() {
    virtualTime = Date.now();
    lastRealTime = Date.now();
  };
  window.applyTargetTime = function() {
    var h = parseInt(targetHour.value, 10) || 0;
    var m = parseInt(targetMin.value, 10) || 0;
    var s = parseInt(targetSec.value, 10) || 0;
    var d = new Date(virtualTime);
    d.setHours(h, m, s, 0);
    virtualTime = d.getTime();
    lastRealTime = Date.now();
  };
  window.togglePause = function() {
    isPaused = !isPaused;
    if (isPaused) {
      pauseBtn.textContent = "再開";
      pauseBtn.style.background = "#ef4444";
    } else {
      pauseBtn.textContent = "一時停止";
      pauseBtn.style.background = "#2563eb";
      lastRealTime = Date.now();
    }
  };

  window.changeTheme = function(key) {
    currentTheme = key;
    var dialHTML = "";
    var subSecHTML = "";
    var hourHTML = "";
    var minHTML = "";
    var secHTML = "";
    var capHTML = "";

if (key === "gs_ushio_exact") {
      // 1. ベゼル外周の金属ノッチ（等間隔60箇所の削り出し凹凸）を生成
      var notches = "";
      for (var i = 0; i < 60; i++) {
        var angle = i * 6;
        var isMajor = (i % 5 === 0);
        var notchH = isMajor ? 8 : 5;
        var notchW = isMajor ? 5 : 2.8;
        notches += '<rect x="' + (180 - notchW/2) + '" y="1" width="' + notchW + '" height="' + notchH + '" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" transform="rotate(' + angle + ' 180 180)"/>';
      }

      // 2. ベゼル0〜15分のバーインデックス（実機配置）
      var bezelBars = "";
      for (var b = 1; b <= 14; b++) {
        if (b % 5 !== 0) {
          bezelBars += '<line x1="180" y1="16" x2="180" y2="24" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" transform="rotate(' + (b * 6) + ' 180 180)"/>';
        }
      }

      dialHTML = `
        <!-- 【外枠】チタン削り出しベゼル外周ベース -->
        <circle cx="180" cy="180" r="178" fill="#1e293b"/>
        <circle cx="180" cy="180" r="176" fill="#64748b"/>
        
        <!-- ベゼルグリップノッチ（削り出し凹凸） -->
        <g id="gsBezelNotches">${notches}</g>

        <!-- 【ベゼル】実機プロポーション（外径168〜内径134）の細身セラミックスリング -->
        <circle cx="180" cy="180" r="168" fill="#07223c" stroke="#0f172a" stroke-width="1.5"/>

        <!-- 12時三角マーカー（実機完全一致：頂点が下向きの逆三角形▼）＆丸カプセル -->
        <polygon points="180,31 168,14 192,14" fill="#f8fafc"/>
        <circle cx="180" cy="20" r="4.2" fill="#07223c"/>
        <circle cx="180" cy="20" r="3.2" fill="#f8fafc"/>

        <!-- 0〜15分バー目盛り -->
        <g>${bezelBars}</g>
        
        <!-- ベゼル数字（実機幅広ボールド 10, 20, 30, 40, 50） -->
        <text x="290" y="74" text-anchor="middle" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">10</text>
        <circle cx="316" cy="106" r="2" fill="#f8fafc"/><circle cx="325" cy="130" r="2" fill="#f8fafc"/>
        <text x="328" y="187" text-anchor="middle" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">20</text>
        <text x="290" y="300" text-anchor="middle" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">30</text>
        <text x="70" y="300" text-anchor="middle" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">40</text>
        <text x="32" y="187" text-anchor="middle" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">50</text>

        <!-- 【文字盤】拡大ワイド化（半径134）した黒潮グラデーション -->
        <circle cx="180" cy="180" r="134" fill="url(#gsUshioDial)"/>

        <!-- 実機の潮流模様（密な波頭ライン） -->
        <g opacity="0.6">
          <path d="M 50,96 Q 115,84 180,98 T 310,88" fill="none" stroke="#2563eb" stroke-width="2.2"/>
          <path d="M 47,112 Q 120,100 190,116 T 313,106" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
          <path d="M 46,130 Q 115,142 180,125 T 314,134" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
          <path d="M 46,148 Q 120,134 190,154 T 314,142" fill="none" stroke="#1e40af" stroke-width="2.5"/>
          <path d="M 46,166 Q 115,178 180,162 T 314,172" fill="none" stroke="#2563eb" stroke-width="2.2"/>
          <path d="M 47,184 Q 120,170 195,192 T 313,180" fill="none" stroke="#0284c7" stroke-width="1.8"/>
          <path d="M 50,202 Q 115,214 180,198 T 310,210" fill="none" stroke="#1e3a8a" stroke-width="2.6"/>
          <path d="M 55,220 Q 120,206 190,228 T 305,218" fill="none" stroke="#0f172a" stroke-width="3"/>
        </g>

        <!-- 外周ミニッツチャプタートラック -->
        <circle cx="180" cy="180" r="132" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-dasharray="0.8, 2.65" opacity="0.85"/>

        <!-- 【8時位置パワーリザーブ】実機完全一致（円弧が上・センター向きに膨らみ、針ピボットは外周寄り122,224） -->
        <g>
          <!-- センター（上）に向かって膨らむ弧状ゲージ -->
          <path d="M 122,224 A 28 28 0 0 1 154,204" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
          <circle cx="154" cy="204" r="2.6" fill="#f8fafc"/>
          <line x1="122" y1="224" x2="118" y2="228" stroke="#f8fafc" stroke-width="1.2"/>
          <!-- 実機のシルバー針（外周寄りのピボットからセンター側へ伸びる） -->
          <line x1="122" y1="224" x2="146" y2="209" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="122" cy="224" r="2.2" fill="#334155" stroke="#cbd5e1" stroke-width="0.8"/>
        </g>

        <!-- 12時下：GSロゴ＆レタリング -->
        <text x="180" y="108" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#ffffff">GS</text>
        <text x="180" y="118" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8.2" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Grand Seiko</text>

        <!-- 6時上：SPRING DRIVE / U.F.A. / DIVER'S 300m -->
        <text x="180" y="218" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="5" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">SPRING DRIVE</text>
        <text x="180" y="226" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="5.8" font-weight="900" fill="#ffffff" letter-spacing="0.6">U.F.A.</text>
        <text x="180" y="233" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="4.6" font-weight="bold" fill="#cbd5e1" letter-spacing="0.4">DIVER'S 300m</text>

        <!-- 12時位置：極太ダブル台形ブロック -->
        <use href="#gsIndexV" x="173" y="66"/>
        <use href="#gsIndexV" x="187" y="66"/>
        <!-- 3・6・9時インデックス -->
        <use href="#gsIndexH" x="294" y="180"/>
        <use href="#gsIndexV" x="180" y="294"/>
        <use href="#gsIndexH" x="66" y="180"/>
        <!-- 他アワーインデックス -->
        <use href="#gsIndexV" x="237" y="82" transform="rotate(30 237 82)"/>
        <use href="#gsIndexV" x="278" y="123" transform="rotate(60 278 123)"/>
        <use href="#gsIndexV" x="278" y="237" transform="rotate(120 278 237)"/>
        <use href="#gsIndexV" x="237" y="278" transform="rotate(150 237 278)"/>
        <use href="#gsIndexV" x="123" y="278" transform="rotate(210 123 278)"/>
        <use href="#gsIndexV" x="82" y="237" transform="rotate(240 82 237)"/>
        <use href="#gsIndexV" x="82" y="123" transform="rotate(300 82 123)"/>
        <use href="#gsIndexV" x="123" y="82" transform="rotate(330 123 82)"/>
      `;

      // 【時針】先端に向けて幅広になる極太切妻バトン針
      hourHTML = `
        <polygon points="174,180 171,134 180,120 189,134 186,180" fill="#cbd5e1" stroke="#334155" stroke-width="0.8"/>
        <polygon points="176,176 173.5,136 180,124 186.5,136 184,176" fill="#f8fafc"/>
        <line x1="180" y1="126" x2="180" y2="174" stroke="#94a3b8" stroke-width="0.8"/>
      `;

      // 【分針】巨大三角アローヘッドを持つ長針
      minHTML = `
        <polygon points="175,180 175,94 185,94 185,180" fill="#cbd5e1" stroke="#334155" stroke-width="0.8"/>
        <polygon points="177,176 177,96 183,96 183,176" fill="#f8fafc"/>
        <polygon points="163,94 180,64 197,94" fill="#cbd5e1" stroke="#334155" stroke-width="0.8"/>
        <polygon points="167,92 180,69 193,92" fill="#f8fafc"/>
      `;

      // 【秒針】ストレート針＋分針アロー内側（先端側）に位置する丸型蓄光ドット
      secHTML = `
        <line x1="180" y1="216" x2="180" y2="54" stroke="#f8fafc" stroke-width="1.3"/>
        <circle cx="180" cy="74" r="4.5" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="180" cy="74" r="3.4" fill="#f8fafc"/>
        <polygon points="180,198 177,208 180,214 183,208" fill="#cbd5e1"/>
      `;

      // 【センターキャップ】鏡面フラットディスク
      capHTML = `
        <circle cx="180" cy="180" r="8.5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
        <circle cx="180" cy="180" r="3" fill="#334155"/>
      `;
    }

    if (key === "rolex_submariner") {
      dialHTML = `
        <circle cx="180" cy="180" r="176" fill="#475569" stroke="#1e293b" stroke-width="2"/>
        <circle cx="180" cy="180" r="172" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="2, 3"/>
        <circle cx="180" cy="180" r="169" fill="#090a0d" stroke="#000" stroke-width="2"/>

    dialGroup.innerHTML = dialHTML;
    subSecGroup.innerHTML = subSecHTML;
    hourGroup.innerHTML = hourHTML;
    minGroup.innerHTML = minHTML;
    secGroup.innerHTML = secHTML;
    capGroup.innerHTML = capHTML;
  };

  function update() {
    var nowTime = Date.now();
    var delta = nowTime - lastRealTime;
    lastRealTime = nowTime;

    if (!isPaused) {
      virtualTime += delta * speed;
    }

    var d = new Date(virtualTime);
    var ms = d.getMilliseconds();
    var s = d.getSeconds() + ms / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;

    hourGroup.setAttribute("transform", "rotate(" + (h * 30) + " 180 180)");
    minGroup.setAttribute("transform", "rotate(" + (m * 6) + " 180 180)");

    if (currentTheme === "rolex_panda") {
      var dSub = document.getElementById("daytonaSubSec");
      if (dSub) dSub.setAttribute("transform", "rotate(" + (s * 6) + " 180 236)");
      secGroup.setAttribute("transform", "rotate(0 180 180)");
    } else if (currentTheme === "omega_pro") {
      var spSub = document.getElementById("speedySubSec");
      if (spSub) spSub.setAttribute("transform", "rotate(" + (s * 6) + " 124 180)");
      secGroup.setAttribute("transform", "rotate(0 180 180)");
    } else if (currentTheme === "heuer_monaco") {
      var moSub = document.getElementById("monacoSubSec");
      if (moSub) moSub.setAttribute("transform", "rotate(" + (s * 6) + " 112 180)");
      secGroup.setAttribute("transform", "rotate(0 180 180)");
    } else {
      secGroup.setAttribute("transform", "rotate(" + (s * 6) + " 180 180)");
    }

    var hh = ("0" + d.getHours()).slice(-2);
    var mm = ("0" + d.getMinutes()).slice(-2);
    var ss = ("0" + Math.floor(s)).slice(-2);
    digitalTimeEl.textContent = hh + ":" + mm + ":" + ss;

    requestAnimationFrame(update);
  }

  // 古いキャッシュをクリア
  if ("serviceWorker" in navigator) {
    caches.keys().then(function(names) {
      names.forEach(function(name) { caches.delete(name); });
    });
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      registrations.forEach(function(r) { r.unregister(); });
    });
  }

  changeTheme("gs_ushio_exact");
  requestAnimationFrame(update);
})();
</script>
