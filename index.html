    body {

      align-items: center;
      justify-content: center;
      min-height: 98vh;
      background-color: #050608;
      color: #e2e8f0;

      border-radius: 28px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.95), inset 0 1px 1px rgba(255,255,255,0.12);
      width: 100%;

    .control-row {
      display: flex;

      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 13px; font-weight: bold; color: #94a3b8; }
    select {
      padding: 8px 12px;

      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      max-width: 100%;
    }
    input[type="range"] { width: 130px; cursor: pointer; }
    input[type="number"] {
      width: 65px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      text-align: right;
    }
    .time-input { width: 44px !important; text-align: center !important; }
    .digital-readout {
      margin: 6px 0;
      font-size: 26px;
      font-family: "SF Mono", "Courier New", monospace;
      color: #cbd5e1;
      letter-spacing: 2px;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }

          0 0 0 0 0.15
          0 0 0 0 0.45

      <span>:</span>
      <input type="number" id="targetSec" class="time-input" min="0" max="59" value="30">
      <button onclick="applyTargetTime()">設定</button>

      <input type="range" id="speedRange" min="0" max="60" step="0.5" value="1">

      <span>倍</span>
    </div>

    <div class="button-group">
      <button onclick="setSpeed(1)">等倍</button>
      <button onclick="setSpeed(2)">2倍</button>
      <button onclick="setSpeed(10)">10倍</button>
      <button onclick="setSpeed(60)">60倍</button>

<script>
(function() {
  var dialGroup = document.getElementById("dialGroup");
  var hourGroup = document.getElementById("hourGroup");
  var minGroup = document.getElementById("minGroup");
  var secGroup = document.getElementById("secGroup");
  var capGroup = document.getElementById("capGroup");
  var digitalTimeEl = document.getElementById("digitalTime");

  var speedRange = document.getElementById("speedRange");
  var speedInput = document.getElementById("speedInput");
  var pauseBtn = document.getElementById("pauseBtn");
  var targetHour = document.getElementById("targetHour");
  var targetMin = document.getElementById("targetMin");
  var targetSec = document.getElementById("targetSec");

  var speed = 1.0;
  var virtualTime = Date.now();
  var lastRealTime = Date.now();
  var isPaused = false;

  var now = new Date();
  targetHour.value = ("0" + now.getHours()).slice(-2);
  targetMin.value = ("0" + now.getMinutes()).slice(-2);
  targetSec.value = ("0" + now.getSeconds()).slice(-2);

  speedRange.addEventListener("input", function(e) {
    speed = parseFloat(e.target.value);
    speedInput.value = speed;
  });
  speedInput.addEventListener("input", function(e) {
    speed = Math.max(0, parseFloat(e.target.value) || 0);
    speedRange.value = speed;
  });

  window.setSpeed = function(v) {
    speed = v;
    speedRange.value = v;
    speedInput.value = v;
  };
  window.resetToRealTime = function() {
    virtualTime = Date.now();
    lastRealTime = Date.now();
  };
  window.applyTargetTime = function() {
    var h = parseInt(targetHour.value, 10) || 0;
    var m = parseInt(targetMin.value, 10) || 0;
    var s = parseInt(targetSec.value, 10) || 0;
    var d = new Date(virtualTime);
    d.setHours(h, m, s, 0);
    virtualTime = d.getTime();
    lastRealTime = Date.now();
  };
  window.togglePause = function() {
    isPaused = !isPaused;
    if (isPaused) {
      pauseBtn.textContent = "再開";
      pauseBtn.style.background = "#ef4444";
    } else {
      pauseBtn.textContent = "一時停止";
      pauseBtn.style.background = "#2563eb";
      lastRealTime = Date.now();
    }
  };

  window.changeTheme = function(key) {
    var dialHTML = "";
    var hourHTML = "";
    var minHTML = "";
    var secHTML = "";
    var capHTML = "";

    if (key === "gs_ushio_real") {
      // ★ グランドセイコー Ushio 300 (SLGB023) 実機スクショ完全解析造形

        <circle cx="180" cy="18" r="3.2" fill="#7dd3fc"/>
        <circle cx="218" cy="15" r="1.6" fill="#f8fafc"/><circle cx="236" cy="21" r="1.6" fill="#f8fafc"/>
        <circle cx="253" cy="28" r="1.6" fill="#f8fafc"/><circle cx="269" cy="38" r="1.6" fill="#f8fafc"/>
        <text x="296" y="66" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">10</text>
        <circle cx="317" cy="94" r="1.6" fill="#f8fafc"/><circle cx="327" cy="113" r="1.6" fill="#f8fafc"/>
        <circle cx="334" cy="133" r="1.6" fill="#f8fafc"/><circle cx="338" cy="154" r="1.6" fill="#f8fafc"/>
        <text x="338" y="196" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">20</text>
        <text x="296" y="316" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#f8fafc">30</text>

        <g filter="url(#gsUshioTexture)">
          <circle cx="180" cy="180" r="142" fill="url(#gsUshioGrad)"/>
          <!-- 実機特有の水平波線エンボス構造 -->
          <path d="M 45,95 Q 110,85 180,105 T 315,90" fill="none" stroke="#38bdf8" stroke-width="2.6" opacity="0.65"/>

          <path d="M 38,142 Q 105,155 175,135 T 322,148" fill="none" stroke="#7dd3fc" stroke-width="2.4" opacity="0.7"/>

        <circle cx="180" cy="180" r="139" fill="none" stroke="#f8fafc" stroke-width="4.5" stroke-dasharray="0.8, 2.84" opacity="0.85"/>

        <!-- 8時位置：実機パワーリザーブインジケーター（繊細な扇形スケール＆小針） -->
        <path d="M 122,204 A 36 36 0 0 1 106,234" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="122" y1="204" x2="117" y2="206" stroke="#ffffff" stroke-width="1.2"/>

        <circle cx="180" cy="236" r="26" fill="#1f2937" stroke="#e2e8f0" stroke-width="1.5"/>
        <path d="M 165,108 Q 180,102 195,108 Q 180,116 165,108 Z" fill="#eab308"/>
        <text x="180" y="112" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="900" fill="#eab308">B</text>
        <text x="180" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">BREITLING</text>
        <text x="180" y="133" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#ef4444">NAVITIMER</text>
      `;
      hourHTML = `<rect x="176" y="96" width="8" height="88" fill="#f8fafc"/><rect x="178" y="104" width="4" height="60" fill="#ef4444"/>`;
      minHTML  = `<rect x="177" y="56" width="6" height="128" fill="#f8fafc"/><rect x="178.5" y="64" width="3" height="96" fill="#ef4444"/>`;
      secHTML  = `<line x1="180" y1="210" x2="180" y2="40" stroke="#ef4444" stroke-width="1.4"/><polygon points="180,40 176,50 184,50" fill="#ef4444"/>`;
      capHTML  = `<circle cx="180" cy="180" r="4.5" fill="#f8fafc"/>`;
    }

    dialGroup.innerHTML = dialHTML;
    hourGroup.innerHTML = hourHTML;
    minGroup.innerHTML = minHTML;
    secGroup.innerHTML = secHTML;
    capGroup.innerHTML = capHTML;
  };

  function update() {
    var nowTime = Date.now();
    var delta = nowTime - lastRealTime;
    lastRealTime = nowTime;

    if (!isPaused) {
      virtualTime += delta * speed;
    }

    var d = new Date(virtualTime);
    var ms = d.getMilliseconds();
    var s = d.getSeconds() + ms / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;

    hourGroup.setAttribute("transform", "rotate(" + (h * 30) + " 180 180)");
    minGroup.setAttribute("transform", "rotate(" + (m * 6) + " 180 180)");
    secGroup.setAttribute("transform", "rotate(" + (s * 6) + " 180 180)");

    var hh = ("0" + d.getHours()).slice(-2);
    var mm = ("0" + d.getMinutes()).slice(-2);
    var ss = ("0" + Math.floor(s)).slice(-2);
    digitalTimeEl.textContent = hh + ":" + mm + ":" + ss;

    requestAnimationFrame(update);
  }

  // 初期表示を新解析GS Ushio 300に設定
  changeTheme("gs_ushio_real");
  requestAnimationFrame(update);

  // 【自己更新機能付き Service Worker (v10)】
  if ("serviceWorker" in navigator) {
    var swCode = `
      var CACHE_NAME = 'real-clock-v10-gs-real';
      self.addEventListener('install', function(e) {
        self.skipWaiting();
      });
      self.addEventListener('activate', function(e) {
        e.waitUntil(
          caches.keys().then(function(keys) {
            return Promise.all(
              keys.map(function(k) {
                if (k !== CACHE_NAME) return caches.delete(k);
              })
            );
          }).then(function() {
            return clients.claim();
          })
        );
      });
      self.addEventListener('fetch', function(e) {
        e.respondWith(
          fetch(e.request).then(function(res) {
            var copy = res.clone();
            caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
            return res;
          }).catch(function() { return caches.match(e.request); })
        );
      });
    `;
    var blob = new Blob([swCode], { type: "application/javascript" });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).then(function(reg) {
      reg.onupdatefound = function() {
        var installingWorker = reg.installing;
        installingWorker.onstatechange = function() {
          if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        };
      };
    }).catch(function() {});
  }
})();
</script>
