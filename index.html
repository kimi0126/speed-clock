  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 98vh;
      background-color: #050608;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #161820 0%, #08090d 100%);
      padding: 18px 14px;
      border-radius: 28px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.95), inset 0 1px 1px rgba(255,255,255,0.12);
      width: 100%;
      max-width: 480px;
    }
    .clock-svg {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.85));
      display: block;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 13px; font-weight: bold; color: #94a3b8; }
    select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      max-width: 100%;
    }
    input[type="range"] { width: 130px; cursor: pointer; }
    input[type="number"] {
      width: 65px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      text-align: right;
    }
    .time-input { width: 44px !important; text-align: center !important; }
    .digital-readout {
      margin: 6px 0;
      font-size: 26px;
      font-family: "SF Mono", "Courier New", monospace;
      color: #cbd5e1;
      letter-spacing: 2px;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>

      <input type="number" id="targetSec" class="time-input" min="0" max="59" value="30">

    } else if (key === "iwc") {
      dialHTML = `
        <circle cx="180" cy="180" r="175" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
        <circle cx="180" cy="120" r="30" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

        <g fill="#1e3a8a" font-family="Georgia, serif" font-weight="bold" font-size="22" text-anchor="middle">

          <text x="294" y="262">4</text><text x="246" y="310">5</text><text x="180" y="330">6</text><text x="114" y="310">7</text>

    dialGroup.innerHTML = dialHTML;

    secGroup.innerHTML = secHTML;
    capGroup.innerHTML = capHTML;
  };

  function update() {
    var nowTime = Date.now();
    var delta = nowTime - lastRealTime;
    lastRealTime = nowTime;

    if (!isPaused) {
      virtualTime += delta * speed;
    }

    var d = new Date(virtualTime);
    var ms = d.getMilliseconds();
    var s = d.getSeconds() + ms / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;

    hourGroup.setAttribute("transform", "rotate(" + (h * 30) + " 180 180)");
    minGroup.setAttribute("transform", "rotate(" + (m * 6) + " 180 180)");
    secGroup.setAttribute("transform", "rotate(" + (s * 6) + " 180 180)");

    var hh = ("0" + d.getHours()).slice(-2);
    var mm = ("0" + d.getMinutes()).slice(-2);
    var ss = ("0" + Math.floor(s)).slice(-2);
    digitalTimeEl.textContent = hh + ":" + mm + ":" + ss;

    requestAnimationFrame(update);
  }

  // 初期表示を新ヴァシュロン・コンスタンタンに設定
  changeTheme("vc_cabinotiers");
  requestAnimationFrame(update);

  // 【自己更新機能付き Service Worker】
  if ("serviceWorker" in navigator) {
    var swCode = `
      var CACHE_NAME = 'real-clock-v8-vc-cabinotiers';
      self.addEventListener('install', function(e) {
        self.skipWaiting();
      });
      self.addEventListener('activate', function(e) {
        e.waitUntil(
          caches.keys().then(function(keys) {
            return Promise.all(
              keys.map(function(k) {
                if (k !== CACHE_NAME) return caches.delete(k);
              })
            );
          }).then(function() {
            return clients.claim();
          })
        );
      });
      self.addEventListener('fetch', function(e) {
        e.respondWith(
          fetch(e.request).then(function(res) {
            var copy = res.clone();
            caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
            return res;
          }).catch(function() { return caches.match(e.request); })
        );
      });
    `;
    var blob = new Blob([swCode], { type: "application/javascript" });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).then(function(reg) {
      reg.onupdatefound = function() {
        var installingWorker = reg.installing;
        installingWorker.onstatechange = function() {
          if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        };
      };
    }).catch(function() {});
  }
})();
</script>
